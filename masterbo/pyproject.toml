[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterbo"
version = "0.1.0"
description = "A small Python starter project."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "masterbo" }
]
dependencies = []

[project.scripts]
masterbo = "masterbo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]